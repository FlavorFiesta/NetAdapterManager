name: Build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore tests/NetAdapterManager.SelfTest/NetAdapterManager.SelfTest.csproj
      - run: dotnet build tests/NetAdapterManager.SelfTest/NetAdapterManager.SelfTest.csproj -c Release --no-restore -warnaserror
      - run: dotnet list NetAdapterManager.csproj package --vulnerable --include-transitive
      # Hardware/WMI and UI tests run locally; hosted runners have no required adapters.
